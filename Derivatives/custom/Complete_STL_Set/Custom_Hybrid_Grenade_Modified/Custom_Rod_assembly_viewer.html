<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Rod Assembly (10 Parts) - Interactive 3D Viewer</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 30%, #161b26 0%, #0a0c10 100%);
      --panel-bg: rgba(22, 27, 34, 0.92);
      --panel-border: rgba(255, 255, 255, 0.14);
      --accent: #58a6ff;
      --accent-glow: rgba(88, 166, 255, 0.4);
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --card-bg: rgba(13, 17, 23, 0.85);
      --success: #3fb950;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Floating Header */
    .header {
      position: absolute;
      top: 20px;
      left: 24px;
      z-index: 10;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 16px 22px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      max-width: 460px;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
    }

    .badge {
      background: rgba(63, 185, 80, 0.2);
      border: 1px solid var(--success);
      color: var(--success);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .header p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.4;
    }

    /* Bottom Control Bar */
    .control-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 40px;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
    }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .slider-group label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--accent);
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 180px;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.2);
      outline: none;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 10px var(--accent-glow);
      transition: transform 0.1s;
    }

    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .btn {
      background: var(--card-bg);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background: rgba(88, 166, 255, 0.2);
      border-color: var(--accent);
      color: #fff;
    }

    .btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    /* Sidebar: Parts List & Inspector */
    .sidebar {
      position: absolute;
      top: 20px;
      right: 24px;
      width: 340px;
      max-height: calc(100vh - 40px);
      z-index: 10;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .sidebar-header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-header h2 {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }

    .parts-scroll {
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .parts-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .parts-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    .part-item {
      background: var(--card-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .part-item:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .part-item.selected {
      border-color: var(--accent);
      background: rgba(88, 166, 255, 0.15);
      box-shadow: 0 0 12px rgba(88, 166, 255, 0.25);
    }

    .part-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .part-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .part-details {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 6px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
    }

    /* Loading Overlay */
    #loading {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0d1117;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(88, 166, 255, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s infinite linear;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #loading p {
      margin-top: 16px;
      font-size: 14px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }
  </style>
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://unpkg.com/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <p>Loading Custom Rod 3D Assembly...</p>
  </div>

  <div class="header">
    <h1>Custom Rod Assembly <span class="badge">10 Parts / 0 Overlap</span></h1>
    <p>3-Member Full-Depth Rod &bull; Split Upper Hinge Yoke &bull; 3 Transverse Retention Keys &bull; Detent Spring &bull; Bottom Retention Disc</p>
  </div>

  <div id="canvas-container"></div>

  <div class="control-bar">
    <div class="slider-group">
      <label for="explode-slider">Explode</label>
      <input type="range" id="explode-slider" min="0" max="1" step="0.005" value="0">
    </div>
    <button class="btn" id="btn-animate">Play Animation</button>
    <button class="btn" id="btn-wireframe">Wireframe</button>
    <button class="btn" id="btn-reset">Reset View</button>
  </div>

  <div class="sidebar">
    <div class="sidebar-header">
      <h2>Rod Components (10)</h2>
      <span class="badge" style="background:rgba(88,166,255,0.2); color:var(--accent); border-color:var(--accent);">100% Watertight</span>
    </div>
    <div class="parts-scroll" id="parts-list"></div>
  </div>

kqUn/5KlJ/+SpSf/kqUn/5KlJ/+SpSf/kqUn/5KlJ/+SpSf/kqUn/5KlJ/+SpSf/kqUn/5KlJ/+SpSf/kqUn/5KlJ/+SpSf/kqUn/5KlJ/+SpSf/kqUn/5KlJ/+SpSf/kqUn/5KlJ/+SpSf/kqUn/5KlJ/+SpSf/kqUn/5KlJ/+SpSf/kqUn/5KlJ/+SpSf/kqUn/5KlJ/+SpSf/kqUn/5KlJ/+SpSf/kqUn/5KlJ/+SpSf/kqUn/5KlJ/+SpSf/kqUn/";

    let scene, camera, renderer, controls;
    let meshesMap = new Map();
    let selectedMesh = null;
    let isWireframe = false;
    let isAnimating = false;
    let animDir = 1;

    function init() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
      camera.position.set(60, 80, 120);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.target.set(0, 55, 0);

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);

      const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.5);
      dirLight1.position.set(100, 150, 100);
      dirLight1.castShadow = true;
      scene.add(dirLight1);

      const dirLight2 = new THREE.DirectionalLight(0x58a6ff, 0.8);
      dirLight2.position.set(-100, 50, -100);
      scene.add(dirLight2);

      const pointLight = new THREE.PointLight(0xffffff, 0.6);
      pointLight.position.set(0, -50, 50);
      scene.add(pointLight);

      // Ground shadow plane
      const planeGeo = new THREE.PlaneGeometry(300, 300);
      const planeMat = new THREE.ShadowMaterial({ opacity: 0.25 });
      const plane = new THREE.Mesh(planeGeo, planeMat);
      plane.rotation.x = -Math.PI / 2;
      plane.position.y = 10;
      plane.receiveShadow = true;
      scene.add(plane);

      loadModel();
      buildPartsList();
      setupEvents();
      animate();
    }

    function loadModel() {
      const loader = new THREE.GLTFLoader();
      const binary = atob(GLB_B64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }

      loader.parse(bytes.buffer, '', (gltf) => {
        gltf.scene.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            child.userData.origPos = child.position.clone();

            const pData = PARTS_DATA.find(p => p.name === child.name);
            if (pData) {
              child.userData.disp = new THREE.Vector3(...pData.disp);
              child.userData.color = pData.color;
              // PBR material
              child.material = new THREE.MeshStandardMaterial({
                color: new THREE.Color(`rgb(${pData.color.join(',')})`),
                roughness: 0.35,
                metalness: 0.15,
              });
            }
            meshesMap.set(child.name, child);
          }
        });
        scene.add(gltf.scene);
        document.getElementById('loading').style.opacity = 0;
        setTimeout(() => document.getElementById('loading').style.display = 'none', 500);
      });
    }

    function buildPartsList() {
      const container = document.getElementById('parts-list');
      PARTS_DATA.forEach(part => {
        const item = document.createElement('div');
        item.className = 'part-item';
        item.id = `item-${part.name.replace(/[^a-zA-Z0-9]/g, '_')}`;
        item.innerHTML = `
          <div class="part-header">
            <div class="color-dot" style="background: rgb(${part.color.join(',')})"></div>
            <div class="part-name" title="${part.name}">${part.name}</div>
          </div>
          <div class="part-details">
            <span>Vol: ${part.volume_mm3} mm³</span>
            <span>Dim: ${part.extents_mm.join(' × ')}</span>
          </div>
        `;
        item.onclick = () => selectPart(part.name);
        container.appendChild(item);
      });
    }

    function selectPart(name) {
      document.querySelectorAll('.part-item').forEach(el => el.classList.remove('selected'));
      const itemEl = document.getElementById(`item-${name.replace(/[^a-zA-Z0-9]/g, '_')}`);
      if (itemEl) itemEl.classList.add('selected');

      const mesh = meshesMap.get(name);
      if (!mesh) return;

      if (selectedMesh === mesh) {
        // Deselect
        selectedMesh = null;
        meshesMap.forEach(m => {
          m.material.opacity = 1.0;
          m.material.transparent = false;
        });
        if (itemEl) itemEl.classList.remove('selected');
        return;
      }

      selectedMesh = mesh;
      meshesMap.forEach(m => {
        if (m === mesh) {
          m.material.opacity = 1.0;
          m.material.transparent = false;
        } else {
          m.material.opacity = 0.25;
          m.material.transparent = true;
        }
      });
    }

    function updateExplode(factor) {
      meshesMap.forEach((mesh) => {
        if (mesh.userData.disp) {
          mesh.position.copy(mesh.userData.origPos).addScaledVector(mesh.userData.disp, factor);
        }
      });
    }

    function setupEvents() {
      const slider = document.getElementById('explode-slider');
      slider.oninput = (e) => {
        isAnimating = false;
        document.getElementById('btn-animate').classList.remove('active');
        updateExplode(parseFloat(e.target.value));
      };

      document.getElementById('btn-animate').onclick = function() {
        isAnimating = !isAnimating;
        this.classList.toggle('active', isAnimating);
      };

      document.getElementById('btn-wireframe').onclick = function() {
        isWireframe = !isWireframe;
        this.classList.toggle('active', isWireframe);
        meshesMap.forEach(m => m.material.wireframe = isWireframe);
      };

      document.getElementById('btn-reset').onclick = function() {
        controls.reset();
        camera.position.set(60, 80, 120);
        controls.target.set(0, 55, 0);
        slider.value = 0;
        updateExplode(0);
        isAnimating = false;
        document.getElementById('btn-animate').classList.remove('active');
        selectPart(null);
      };

      window.onresize = () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      };
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();

      if (isAnimating) {
        const slider = document.getElementById('explode-slider');
        let val = parseFloat(slider.value) + 0.008 * animDir;
        if (val >= 1) {
          val = 1;
          animDir = -1;
        } else if (val <= 0) {
          val = 0;
          animDir = 1;
        }
        slider.value = val;
        updateExplode(val);
      }

      renderer.render(scene, camera);
    }

    init();
  </script>
